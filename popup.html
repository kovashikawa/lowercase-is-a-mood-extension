<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lowercase Is a Mood</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; padding: 10px 14px; }
    button {
      display: block;
      padding: 4px 6px;
      border: 0;
      background: none;
      color: inherit;
      font: 400 26px/1 system-ui, sans-serif;
      cursor: pointer;
    }
    button:disabled { opacity: .35; cursor: default; }
    button:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
    #lowercase, #original {
      display: inline-block;
      min-width: .68em;
      text-align: center;
      transition: font-weight .2s ease;
    }
    #slash { opacity: .45; }
    button[aria-pressed="true"] #lowercase,
    button[aria-pressed="false"] #original { font-weight: 700; }
    #status {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
    }
    @media (prefers-reduced-motion: reduce) {
      #lowercase, #original { transition: none; }
    }
  </style>
</head>
<body>
  <button id="toggle" type="button" aria-label="Toggle lowercase on this site" aria-pressed="false" disabled>
    <span id="lowercase">a</span><span id="slash">/</span><span id="original">A</span>
  </button>
  <p id="status" role="status"></p>
  <script src="popup.js"></script>
</body>
</html>
