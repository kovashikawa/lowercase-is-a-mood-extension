<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lowercase Is a Mood</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      box-sizing: border-box;
      width: 202px;
      margin: 0;
      padding: 16px;
      font: 13px/1.4 system-ui, sans-serif;
    }
    button {
      padding: 0;
      border: 0;
      background: none;
      color: inherit;
      font: 400 23px/1.2 system-ui, sans-serif;
      cursor: pointer;
    }
    button:disabled { opacity: .45; cursor: default; }
    button:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
    button[aria-pressed="true"] #lowercase,
    button[aria-pressed="false"] #original { font-weight: 700; }
    #slash { padding: 0 4px; opacity: .55; }
    p { margin: 10px 0 0; opacity: .7; }
  </style>
</head>
<body>
  <button id="toggle" type="button" aria-label="Toggle lowercase on this site" aria-pressed="false" disabled>
    <span id="lowercase">a</span><span id="slash">/</span><span id="original">A</span>
  </button>
  <p id="status" role="status">Checking this page…</p>
  <script src="popup.js"></script>
</body>
</html>
